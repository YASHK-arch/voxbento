name: Post Translation Load Report

on:
  workflow_run:
    workflows: ["Translation Load Benchmark"]
    types: [completed]

concurrency:
  group: post-translation-load-report
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download benchmark report artifact
        uses: actions/download-artifact@v7.0.0
        with:
          name: translation-load-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: report

      - name: Post or update PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const run = context.payload.workflow_run;
            const headSha = run.head_sha;

            if (!headSha) {
              core.setFailed('Missing head_sha on workflow_run.');
              return;
            }

            // 1. Derive the target PR from trusted GitHub metadata
            let targetPrNumber = null;
            const prs = run.pull_requests ?? [];
            if (prs.length > 0 && prs[0]?.number) {
              targetPrNumber = prs[0].number;
            } else {
              const { data: associatedPrs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: headSha,
              });
              const found = associatedPrs.find((p) => p.state === 'open') ?? associatedPrs[0];
              targetPrNumber = found?.number;
            }

            if (!targetPrNumber) {
              core.info(`No pull request found associated with head SHA ${headSha}.`);
              return;
            }

            // Fetch current, real-time PR state
            const { data: latestPr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: targetPrNumber,
            });

            // 2. Reject stale out-of-order runs: verify headSha is still the PR's current head
            if (latestPr.head.sha !== headSha) {
              core.info(`PR #${targetPrNumber} head SHA (${latestPr.head.sha}) has moved past this run (${headSha}). Skipping stale run.`);
              return;
            }

            // 3. Verify artifact authenticity against derived target PR
            const commentFile = path.join(process.cwd(), 'report', 'comment.md');
            const prNumberFile = path.join(process.cwd(), 'report', 'pr_number.txt');
            const artifactShaFile = path.join(process.cwd(), 'report', 'head_sha.txt');

            if (!fs.existsSync(commentFile)) {
              core.warning('Comment report file not found in artifact.');
              return;
            }

            if (fs.existsSync(prNumberFile)) {
              const artifactPrNumber = parseInt(fs.readFileSync(prNumberFile, 'utf8').trim(), 10);
              if (artifactPrNumber && artifactPrNumber !== targetPrNumber) {
                core.setFailed(`Artifact PR number (${artifactPrNumber}) does not match trusted target PR (${targetPrNumber}). Potential forgery rejected.`);
                return;
              }
            }

            if (fs.existsSync(artifactShaFile)) {
              const artifactSha = fs.readFileSync(artifactShaFile, 'utf8').trim();
              if (artifactSha && artifactSha !== headSha) {
                core.setFailed(`Artifact head SHA (${artifactSha}) does not match trusted run head SHA (${headSha}). Potential forgery rejected.`);
                return;
              }
            }

            const body = fs.readFileSync(commentFile, 'utf8').trim();
            const { owner, repo } = context.repo;
            const marker = '<!-- translation-load-benchmark-report -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: targetPrNumber,
              per_page: 100,
            });

            const existingComment = comments.find((c) => c.body && c.body.includes(marker));

            if (existingComment) {
              core.info(`Updating existing comment #${existingComment.id} on PR #${targetPrNumber}`);
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              core.info(`Creating new comment on PR #${targetPrNumber}`);
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: targetPrNumber,
                body,
              });
            }
